<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="404_title">Page Not Found - SHOTTYSHOP</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .error-card { background: white; border-radius: 32px; padding: 3rem 2rem; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); animation: fadeInUp 0.5s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .error-code { font-size: 8rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.5rem; line-height: 1; }
    .error-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; color: #1a1a1a; }
    .error-message { color: #666; margin-bottom: 2rem; line-height: 1.6; }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary, .btn-secondary { padding: 12px 24px; border-radius: 40px; text-decoration: none; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-primary { background: #1a1a1a; color: white; }
    .btn-primary:hover { background: #333; transform: translateY(-2px); }
    .btn-secondary { background: #f0f0f0; color: #1a1a1a; border: 1px solid #e5e5e5; }
    .btn-secondary:hover { background: #e5e5e5; transform: translateY(-2px); }
    .search-box { margin-top: 2rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .search-input { padding: 12px 16px; border: 1px solid #ddd; border-radius: 40px; width: 250px; font-size: 0.9rem; }
    .search-btn { background: #1a1a1a; color: white; border: none; padding: 12px 20px; border-radius: 40px; cursor: pointer; }
    @media (max-width: 480px) { .error-code { font-size: 5rem; } .error-title { font-size: 1.4rem; } }
    body.dark-mode .error-card { background: #1e1e1e; }
    body.dark-mode .error-title { color: #e0e0e0; }
    body.dark-mode .btn-secondary { background: #333; color: white; border-color: #444; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title" data-key="page_not_found">Page Not Found</h1>
      <p class="error-message" data-key="404_message">Sorry, the page you are looking for doesn't exist or has been moved.</p>
      <div class="error-actions">
        <a href="./index.html" class="btn-primary" data-key="go_home">🏠 Go Home</a>
        <a href="/crud/login.html" class="btn-secondary" data-key="login">🔐 Login</a>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" data-placeholder-key="search_products">
        <button id="searchBtn" class="search-btn" data-key="search">🔍 Search</button>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('searchBtn')?.addEventListener('click', () => { const query = document.getElementById('searchInput').value.trim(); if (query) window.location.href = `/index.html?search=${encodeURIComponent(query)}`; else window.location.href = '/index.html'; });
    document.getElementById('searchInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });
  </script>
</body>
</html>
