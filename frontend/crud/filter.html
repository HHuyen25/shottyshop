<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="filter_title">Shop with Filters - SHOTTYSHOP</title>
  <link rel="icon" type="image/png" href="/image/logo.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .filter-page-container { display: flex; gap: 2rem; max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
    .filter-sidebar { width: 280px; flex-shrink: 0; background: var(--bg-card, white); border-radius: 16px; padding: 1.5rem; height: fit-content; position: sticky; top: 80px; border: 1px solid var(--border-color, #eee); }
    .filter-section { margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color, #eee); padding-bottom: 1rem; }
    .filter-section h4 { margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--text-primary, #1a1a1a); }
    .filter-category-item, .filter-checkbox { display: block; margin-bottom: 0.5rem; cursor: pointer; color: var(--text-secondary, #666); }
    .filter-category-item input, .filter-checkbox input { margin-right: 0.5rem; }
    .price-range { display: flex; gap: 0.5rem; align-items: center; }
    .price-range input { width: 100px; padding: 0.5rem; border: 1px solid var(--border-color, #ddd); border-radius: 8px; background: var(--bg-card, white); color: var(--text-primary, #1a1a1a); }
    .apply-filter-btn { width: 100%; background: #1a1a1a; color: white; border: none; padding: 0.5rem; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; transition: all 0.2s; }
    .apply-filter-btn:hover { background: #333; transform: translateY(-2px); }
    .reset-filter-btn { width: 100%; background: var(--bg-card, #f0f0f0); color: var(--text-primary, #333); border: 1px solid var(--border-color, #ddd); padding: 0.5rem; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; transition: all 0.2s; }
    .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .result-count { color: var(--text-secondary, #666); font-size: 0.85rem; }
    .sort-select { padding: 0.5rem; border: 1px solid var(--border-color, #ddd); border-radius: 8px; background: var(--bg-card, white); color: var(--text-primary, #1a1a1a); cursor: pointer; }
    .product-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; }
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap; }
    .page-btn { padding: 0.5rem 1rem; border: 1px solid var(--border-color, #ddd); background: var(--bg-card, white); color: var(--text-primary, #1a1a1a); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .page-btn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
    .page-btn:hover:not(.active) { background: var(--border-color, #f0f0f0); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 768px) { .filter-page-container { flex-direction: column; } .filter-sidebar { width: 100%; position: static; } }
    body.dark-mode .price-range input, body.dark-mode .sort-select { background: #2a2a2a; border-color: #444; color: white; }
    body.dark-mode .reset-filter-btn { background: #2a2a2a; border-color: #444; color: white; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="filter-page-container">
    <aside class="filter-sidebar">
      <h3 style="margin-bottom:1rem;" data-key="filters">Filters</h3>
      <div class="filter-section"><h4 data-key="categories">Categories</h4><div id="categoryFilters"></div></div>
      <div class="filter-section"><h4 data-key="price_range">Price Range (USD)</h4><div class="price-range"><input type="number" id="minPrice" placeholder="Min" value="0" step="5"><span>-</span><input type="number" id="maxPrice" placeholder="Max" value="500" step="10"></div></div>
      <div class="filter-section"><h4 data-key="special">Special</h4><label class="filter-checkbox"><input type="checkbox" id="filterPreorder"> <span data-key="preorder_only">Pre-order Only</span></label><label class="filter-checkbox"><input type="checkbox" id="filterHanteo"> <span data-key="hanteo_only">Hanteo Chart</span></label><label class="filter-checkbox"><input type="checkbox" id="filterInStock"> <span data-key="in_stock_only">In Stock Only</span></label></div>
      <button class="apply-filter-btn" id="applyFiltersBtn" data-key="apply_filters">Apply Filters</button>
      <button class="reset-filter-btn" id="resetFiltersBtn" data-key="reset_all">Reset All</button>
    </aside>
    <main style="flex:1;">
      <div class="sort-bar"><span class="result-count" id="resultCount">0 products found</span><select id="sortSelect" class="sort-select"><option value="newest" data-key="newest_first">Newest First</option><option value="name_asc" data-key="name_asc">Name: A → Z</option><option value="name_desc" data-key="name_desc">Name: Z → A</option><option value="price_asc" data-key="price_asc">Price: Low → High</option><option value="price_desc" data-key="price_desc">Price: High → Low</option></select></div>
      <div id="productGrid" class="product-grid"></div>
      <div id="pagination" class="pagination"></div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    let allProducts = [], filteredProducts = [], categories = [], currentPage = 1; const itemsPerPage = 12;
    async function loadProducts() { try { showLoading(); const res = await fetch(`${API_URL}/products/all`); allProducts = await res.json(); extractCategories(); renderFilters(); applyFilters(); hideLoading(); } catch(e) { console.error(e); hideLoading(); if (window.toast) toast.error(translations[currentLanguage]?.error || 'Failed to load products'); } }
    function extractCategories() { const catSet = new Set(); allProducts.forEach(p => catSet.add(p.category)); categories = Array.from(catSet); }
    function renderFilters() { const container = document.getElementById('categoryFilters'); if (!container) return; container.innerHTML = categories.map(cat => `<label class="filter-category-item"><input type="checkbox" value="${cat}" class="category-checkbox"> ${cat}</label>`).join(''); }
    function getSelectedCategories() { const checkboxes = document.querySelectorAll('.category-checkbox:checked'); return Array.from(checkboxes).map(cb => cb.value); }
    function applyFilters() { const selectedCats = getSelectedCategories(); const minPrice = parseFloat(document.getElementById('minPrice').value) || 0; const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity; const preorderOnly = document.getElementById('filterPreorder').checked; const hanteoOnly = document.getElementById('filterHanteo').checked; const inStockOnly = document.getElementById('filterInStock').checked; const sortBy = document.getElementById('sortSelect').value; filteredProducts = allProducts.filter(p => { if (selectedCats.length > 0 && !selectedCats.includes(p.category)) return false; if (p.price < minPrice || p.price > maxPrice) return false; if (preorderOnly && !p.preorder) return false; if (hanteoOnly && !p.hanteo) return false; if (inStockOnly && p.stock <= 0) return false; return true; }); switch(sortBy) { case 'name_asc': filteredProducts.sort((a,b) => a.name.localeCompare(b.name)); break; case 'name_desc': filteredProducts.sort((a,b) => b.name.localeCompare(a.name)); break; case 'price_asc': filteredProducts.sort((a,b) => a.price - b.price); break; case 'price_desc': filteredProducts.sort((a,b) => b.price - a.price); break; case 'newest': filteredProducts.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); break; } currentPage = 1; document.getElementById('resultCount').textContent = `${filteredProducts.length} ${translations[currentLanguage]?.products_found || 'products found'}`; renderProducts(); renderPagination(); }
    function renderProducts() { const container = document.getElementById('productGrid'); if (!container) return; const start = (currentPage - 1) * itemsPerPage; const end = start + itemsPerPage; const pageProducts = filteredProducts.slice(start, end); if (pageProducts.length === 0) { container.innerHTML = `<div style="text-align:center;padding:50px; color: var(--text-secondary, #666);" data-key="no_products">No products match your filters</div>`; return; } container.innerHTML = pageProducts.map(p => { const imgUrl = getImageUrl(p.image) || 'https://picsum.photos/300/300'; const stockStatus = p.stock > 0 ? `<span class="in-stock" style="color:#10b981; font-size:0.7rem;" data-key="in_stock">✓ In Stock</span>` : `<span class="out-of-stock" style="color:#ef4444; font-size:0.7rem;" data-key="out_of_stock">✗ Out of Stock</span>`; return `<div class="product-card" data-id="${p._id}" style="cursor:pointer"><img src="${imgUrl}" onerror="this.src='https://picsum.photos/300/300'"><div class="product-info"><div class="product-name">${escapeHtml(p.name)}</div><div class="category-badge">${escapeHtml(p.category).toUpperCase()}</div><div class="price">${p.preorder ? '<span class="preorder-badge" data-key="preorder">PRE-ORDER</span>' : ''}${convertPrice(p.price)}</div><div class="stock-status">${stockStatus}</div>${p.hanteo ? '<div class="shipping-info" data-key="hanteo">HANTEO | Shipped from KR</div>' : ''}<button class="add-to-cart" data-id="${p._id}" data-name="${escapeHtml(p.name)}" data-price="${p.price}" data-image="${imgUrl}" data-key="add_to_cart">🛒 ADD TO CART</button></div></div>`; }).join(''); document.querySelectorAll('.product-card').forEach(card => { card.addEventListener('click', () => window.location.href = `/crud/product-detail.html?id=${card.dataset.id}`); }); document.querySelectorAll('.add-to-cart').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); let cart = JSON.parse(localStorage.getItem('shotyCart')) || []; let existing = cart.find(i => i.id === btn.dataset.id); if (existing) existing.quantity++; else cart.push({ id: btn.dataset.id, name: btn.dataset.name, price: parseFloat(btn.dataset.price), quantity: 1, image: btn.dataset.image }); localStorage.setItem('shotyCart', JSON.stringify(cart)); updateCartCount(); if (window.toast) toast.success(`${translations[currentLanguage]?.added || 'Added'} "${btn.dataset.name}" ${translations[currentLanguage]?.to_cart || 'to cart!'}`); }); }); }
    function renderPagination() { const container = document.getElementById('pagination'); if (!container) return; const totalPages = Math.ceil(filteredProducts.length / itemsPerPage); if (totalPages <= 1) { container.innerHTML = ''; return; } let html = `<button class="page-btn" id="prevPage" ${currentPage === 1 ? 'disabled' : ''} data-key="prev">← Prev</button>`; for (let i = 1; i <= totalPages; i++) { if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) { html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`; } else if (i === currentPage - 3 || i === currentPage + 3) { html += `<span class="page-dots">...</span>`; } } html += `<button class="page-btn" id="nextPage" ${currentPage === totalPages ? 'disabled' : ''} data-key="next">Next →</button>`; container.innerHTML = html; document.querySelectorAll('.page-btn[data-page]').forEach(btn => { btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); renderProducts(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); }); const prevBtn = document.getElementById('prevPage'); const nextBtn = document.getElementById('nextPage'); if (prevBtn) prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderProducts(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }); if (nextBtn) nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; renderProducts(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }); }
    document.getElementById('applyFiltersBtn')?.addEventListener('click', applyFilters);
    document.getElementById('resetFiltersBtn')?.addEventListener('click', () => { document.querySelectorAll('.category-checkbox:checked').forEach(cb => cb.checked = false); document.getElementById('minPrice').value = 0; document.getElementById('maxPrice').value = 500; document.getElementById('filterPreorder').checked = false; document.getElementById('filterHanteo').checked = false; document.getElementById('filterInStock').checked = false; document.getElementById('sortSelect').value = 'newest'; applyFilters(); if (window.toast) toast.info(translations[currentLanguage]?.reset_all || 'All filters reset'); });
    document.getElementById('sortSelect')?.addEventListener('change', applyFilters);
    window.onCurrencyChange = () => { renderProducts(); };
    loadProducts();
  </script>
</body>
</html>
