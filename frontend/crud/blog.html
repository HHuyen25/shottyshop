<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="blog_title">Blog & News - SHOTTYSHOP</title>
  <link rel="icon" type="image/png" href="/image/logo.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .blog-container { max-width: 1280px; margin: 2.5rem auto; padding: 0 1.25rem; }
    .blog-header { text-align: center; margin-bottom: 2.5rem; }
    .blog-header h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; color: var(--text-primary, #0a0a0a); }
    .blog-header p { color: var(--text-secondary, #6e6e76); font-size: 0.95rem; }
    .blog-layout { display: flex; gap: 2.5rem; align-items: flex-start; }
    .blog-main { flex: 3; min-width: 0; }
    .blog-sidebar { flex: 1; position: sticky; top: 90px; }
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.75rem; }
    .blog-card { background: var(--bg-card, #fff); border-radius: 16px; overflow: hidden; transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s; box-shadow: 0 1px 2px var(--shadow, rgba(10,10,10,0.04)); border: 1px solid var(--border-color, #e6e6e6); cursor: pointer; display: flex; flex-direction: column; }
    .blog-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px var(--shadow, rgba(10,10,10,0.1)); border-color: #0a0a0a; }
    .blog-card-image { height: 190px; overflow: hidden; background: var(--bg-body, #f4f4f5); }
    .blog-card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .blog-card:hover .blog-card-image img { transform: scale(1.06); }
    .blog-card-content { padding: 1.4rem; display: flex; flex-direction: column; flex: 1; }
    .blog-card-category { align-self: flex-start; padding: 0.22rem 0.75rem; background: #0a0a0a; color: #fff; border-radius: 99px; font-size: 0.68rem; font-weight: 700; margin-bottom: 0.8rem; }
    .blog-card-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.5rem; color: var(--text-primary, #0a0a0a); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .blog-card-excerpt { font-size: 0.85rem; color: var(--text-secondary, #6e6e76); line-height: 1.55; margin-bottom: 1rem; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .blog-card-meta { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.7rem; color: var(--text-secondary, #a1a1aa); border-top: 1px solid var(--border-color, #eee); padding-top: 0.8rem; }
    .sidebar-widget { background: var(--bg-card, #fff); border-radius: 16px; padding: 1.4rem; margin-bottom: 1.25rem; border: 1px solid var(--border-color, #e6e6e6); }
    .sidebar-widget h3 { margin-bottom: 1rem; font-size: 1rem; font-weight: 700; color: var(--text-primary, #0a0a0a); }
    .category-list { list-style: none; padding: 0; margin: 0; }
    .category-list li { margin-bottom: 0.25rem; }
    .category-list a { display: flex; justify-content: space-between; align-items: center; color: var(--text-secondary, #6e6e76); text-decoration: none; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.88rem; transition: background 0.15s, color 0.15s; }
    .category-list a:hover, .category-list a.active { color: var(--text-primary, #0a0a0a); background: var(--bg-body, #f4f4f5); font-weight: 600; }
    .category-list a span { font-size: 0.75rem; color: var(--text-secondary, #a1a1aa); }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tag { padding: 0.3rem 0.8rem; background: var(--bg-body, #f4f4f5); border: 1px solid var(--border-color, #e6e6e6); border-radius: 99px; font-size: 0.75rem; color: var(--text-secondary, #6e6e76); text-decoration: none; transition: all 0.15s; }
    .tag:hover { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
    .pagination { display: flex; justify-content: center; gap: 0.4rem; margin-top: 2.5rem; flex-wrap: wrap; }
    .page-btn { min-width: 40px; padding: 0.5rem 0.9rem; border: 1px solid var(--border-color, #e6e6e6); background: var(--bg-card, #fff); color: var(--text-primary, #0a0a0a); border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.15s; }
    .page-btn.active { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
    .page-btn:hover:not(.active):not(:disabled) { background: var(--bg-body, #f4f4f5); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .search-input { width: 100%; padding: 11px 14px; border: 1px solid var(--border-color, #e6e6e6); border-radius: 10px; background: var(--bg-card, #fff); color: var(--text-primary, #0a0a0a); font-size: 0.9rem; outline: none; transition: border-color 0.15s; }
    .search-input:focus { border-color: #0a0a0a; }
    .search-btn { width: 100%; margin-top: 0.6rem; padding: 11px; background: #0a0a0a; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    .search-btn:hover { opacity: 0.85; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-secondary, #a1a1aa); }
    @media (max-width: 900px) { .blog-layout { flex-direction: column; } .blog-sidebar { position: static; width: 100%; } .blog-header h1 { font-size: 1.9rem; } }
    /* Màu category (nội dung có ý nghĩa) */
    .category-news { background: #3b82f6; }
    .category-event { background: #f59e0b; }
    .category-guide { background: #10b981; }
    .category-review { background: #8b5cf6; }
    .category-announcement { background: #ef4444; }
    .category-update { background: #06b6d4; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="blog-container">
    <div class="blog-header"><h1 data-key="blog">SHOTTYSHOP Blog</h1><p data-key="blog_subtitle">Latest news, updates, and K-POP insights</p></div>
    <div class="blog-layout">
      <main class="blog-main"><div id="blogGrid" class="blog-grid"></div><div id="pagination" class="pagination"></div></main>
      <aside class="blog-sidebar">
        <div class="sidebar-widget"><h3 data-key="search">Search</h3><input type="text" id="searchInput" class="search-input" data-placeholder-key="search_articles"><button id="searchBtn" class="search-btn" data-key="search">Search</button></div>
        <div class="sidebar-widget"><h3 data-key="categories">Categories</h3><ul class="category-list" id="categoryList"></ul></div>
        <div class="sidebar-widget"><h3 data-key="popular_tags">Popular Tags</h3><div class="tag-cloud" id="tagCloud"></div></div>
        <div class="sidebar-widget"><h3 data-key="newsletter">Newsletter</h3><p style="font-size:0.8rem; margin-bottom:1rem; color: var(--text-secondary, #666);" data-key="newsletter_desc">Subscribe to get updates on new products and K-POP news!</p><input type="email" id="newsletterEmail" class="search-input" data-placeholder-key="your_email"><button id="newsletterBtn" class="search-btn" style="margin-top:0.5rem;" data-key="subscribe">Subscribe →</button></div>
      </aside>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    let currentPage = 1, totalPages = 1, currentCategory = 'all', currentSearch = '', categories = [], popularTags = [];
    async function loadPosts() { try { showLoading(); let url = `${API_URL}/posts?page=${currentPage}&limit=9`; if (currentCategory !== 'all') url += `&category=${currentCategory}`; if (currentSearch) url += `&search=${encodeURIComponent(currentSearch)}`; const res = await fetch(url); const data = await res.json(); renderPosts(data.posts); renderPagination(data.pagination); if (data.categories) { categories = data.categories; renderCategories(); } if (data.popularTags) { popularTags = data.popularTags; renderTags(); } hideLoading(); } catch(e) { console.error(e); hideLoading(); document.getElementById('blogGrid').innerHTML = '<div class="empty-state">Failed to load posts</div>'; } }
    function getCategoryClass(category) { const classes = { 'news': 'category-news', 'event': 'category-event', 'guide': 'category-guide', 'review': 'category-review', 'announcement': 'category-announcement', 'update': 'category-update' }; return classes[category] || 'category-news'; }
    function getCategoryName(category) { const names = { 'news': translations[currentLanguage]?.news || 'News', 'event': translations[currentLanguage]?.event || 'Event', 'guide': translations[currentLanguage]?.guide || 'Guide', 'review': translations[currentLanguage]?.review || 'Review', 'announcement': translations[currentLanguage]?.announcement || 'Announcement', 'update': translations[currentLanguage]?.update || 'Update' }; return names[category] || category; }
    function renderPosts(posts) { const container = document.getElementById('blogGrid'); if (!posts || posts.length === 0) { container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1; text-align:center; padding: 50px;" data-key="no_posts">No posts found</div>'; return; } container.innerHTML = posts.map(post => { const imageUrl = getImageUrl(post.featuredImage) || 'https://picsum.photos/400/250?random=' + post._id; const categoryClass = getCategoryClass(post.category); const categoryName = getCategoryName(post.category); const date = new Date(post.publishedAt || post.createdAt).toLocaleDateString('vi-VN'); return `<div class="blog-card" data-slug="${post.slug}"><div class="blog-card-image"><img src="${imageUrl}" onerror="this.src='https://picsum.photos/400/250'"></div><div class="blog-card-content"><span class="blog-card-category ${categoryClass}">${categoryName}</span><h3 class="blog-card-title">${escapeHtml(post.title)}</h3><p class="blog-card-excerpt">${escapeHtml(post.excerpt || (post.content ? post.content.substring(0, 120) + '...' : ''))}</p><div class="blog-card-meta"><span>${escapeHtml(post.author)}</span><span>${date}</span><span>${post.views || 0} ${translations[currentLanguage]?.views || 'views'}</span></div></div></div>`; }).join(''); document.querySelectorAll('.blog-card').forEach(card => { card.addEventListener('click', () => { const slug = card.dataset.slug; window.location.href = `/crud/blog-detail.html?slug=${slug}`; }); }); }
    function renderPagination(pagination) { const container = document.getElementById('pagination'); if (!pagination || pagination.totalPages <= 1) { container.innerHTML = ''; return; } totalPages = pagination.totalPages; let html = `<button class="page-btn" id="prevPage" ${currentPage === 1 ? 'disabled' : ''} data-key="prev">← Prev</button>`; for (let i = 1; i <= totalPages; i++) { if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) { html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`; } else if (i === currentPage - 3 || i === currentPage + 3) { html += `<span class="page-dots" style="padding: 0.5rem;">...</span>`; } } html += `<button class="page-btn" id="nextPage" ${currentPage === totalPages ? 'disabled' : ''} data-key="next">Next →</button>`; container.innerHTML = html; document.querySelectorAll('.page-btn[data-page]').forEach(btn => { btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); loadPosts(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); }); const prevBtn = document.getElementById('prevPage'); const nextBtn = document.getElementById('nextPage'); if (prevBtn) prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadPosts(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }); if (nextBtn) nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; loadPosts(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }); }
    function renderCategories() { const container = document.getElementById('categoryList'); if (!container) return; let html = `<li><a href="#" data-category="all" class="${currentCategory === 'all' ? 'active' : ''}">${translations[currentLanguage]?.all_posts || 'All Posts'} <span>(${categories.reduce((sum, c) => sum + c.count, 0)})</span></a></li>`; categories.forEach(cat => { html += `<li><a href="#" data-category="${cat.name}" class="${currentCategory === cat.name ? 'active' : ''}">${getCategoryName(cat.name)} <span>(${cat.count})</span></a></li>`; }); container.innerHTML = html; container.querySelectorAll('a').forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); currentCategory = link.dataset.category; currentPage = 1; currentSearch = ''; document.getElementById('searchInput').value = ''; loadPosts(); }); }); }
    function renderTags() { const container = document.getElementById('tagCloud'); if (!container) return; container.innerHTML = popularTags.map(tag => `<a href="#" class="tag" data-tag="${tag.name}">#${escapeHtml(tag.name)} (${tag.count})</a>`).join(''); container.querySelectorAll('.tag').forEach(tag => { tag.addEventListener('click', (e) => { e.preventDefault(); currentSearch = tag.dataset.tag; currentCategory = 'all'; currentPage = 1; document.getElementById('searchInput').value = currentSearch; loadPosts(); }); }); }
    document.getElementById('searchBtn')?.addEventListener('click', () => { currentSearch = document.getElementById('searchInput').value.trim(); currentCategory = 'all'; currentPage = 1; loadPosts(); });
    document.getElementById('searchInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') { currentSearch = e.target.value.trim(); currentCategory = 'all'; currentPage = 1; loadPosts(); } });
    document.getElementById('newsletterBtn')?.addEventListener('click', () => { const email = document.getElementById('newsletterEmail').value.trim(); if (!email || !email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) { if (window.toast) toast.error(translations[currentLanguage]?.valid_email || 'Please enter a valid email'); return; } const subscribers = JSON.parse(localStorage.getItem('newsletterSubscribers') || '[]'); if (!subscribers.includes(email)) { subscribers.push(email); localStorage.setItem('newsletterSubscribers', JSON.stringify(subscribers)); if (window.toast) toast.success(translations[currentLanguage]?.subscribed || 'Subscribed successfully!'); document.getElementById('newsletterEmail').value = ''; } else { if (window.toast) toast.info(translations[currentLanguage]?.already_subscribed || 'Email already subscribed'); } });
    loadPosts();
  </script>
</body>
</html>
