<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="forgot_password_title">Forgot Password - SHOTTYSHOP</title>
  <link rel="icon" type="image/png" href="/image/logo.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .forgot-container { max-width: 450px; margin: 50px auto; padding: 0 20px; }
    .forgot-card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .forgot-header { text-align: center; margin-bottom: 1.5rem; }
    .forgot-header .icon { font-size: 3rem; margin-bottom: 1rem; }
    .forgot-header h2 { margin-bottom: 0.5rem; color: #1a1a1a; }
    .forgot-header p { color: #666; font-size: 0.85rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
    .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; transition: all 0.2s; }
    .form-input:focus { outline: none; border-color: #1a1a1a; box-shadow: 0 0 0 3px rgba(26,26,26,0.1); }
    .btn-primary { width: 100%; background: #1a1a1a; color: white; padding: 12px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: #333; transform: translateY(-2px); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .back-link { text-align: center; margin-top: 1.5rem; }
    .back-link a { color: #666; text-decoration: none; font-size: 0.85rem; }
    .back-link a:hover { color: #1a1a1a; text-decoration: underline; }
    .message { padding: 12px; border-radius: 12px; margin-bottom: 1rem; display: none; text-align: center; }
    .message.success { background: #d1fae5; color: #059669; display: block; }
    .message.error { background: #fee2e2; color: #dc2626; display: block; }
    .message.info { background: #dbeafe; color: #2563eb; display: block; }
    body.dark-mode .forgot-card { background: #1e1e1e; }
    body.dark-mode .forgot-header h2 { color: #e0e0e0; }
    body.dark-mode .form-input { background: #2a2a2a; border-color: #444; color: white; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="forgot-container">
    <div class="forgot-card">
      <div class="forgot-header">
        <div class="icon"></div>
        <h2 data-key="forgot_password">Forgot Password?</h2>
        <p data-key="forgot_instructions">Enter your email address and we'll send you a link to reset your password.</p>
      </div>
      <div id="message" class="message"></div>
      <div class="form-group">
        <label data-key="email">Email Address</label>
        <input type="email" id="emailInput" class="form-input" data-placeholder-key="email">
      </div>
      <button id="sendResetBtn" class="btn-primary" data-key="send_reset_link">Send Reset Link →</button>
      <div class="back-link"><a href="login.html" data-key="back_to_login">← Back to Login</a></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const sendBtn = document.getElementById('sendResetBtn');
    const emailInput = document.getElementById('emailInput');
    const messageDiv = document.getElementById('message');
    function showMessage(text, type) { messageDiv.textContent = text; messageDiv.className = `message ${type}`; setTimeout(() => messageDiv.style.display = 'none', 5000); }
    async function sendResetLink() { const email = emailInput.value.trim(); if (!email) { showMessage(translations[currentLanguage]?.email_required || 'Please enter your email address', 'error'); return; } if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) { showMessage(translations[currentLanguage]?.valid_email || 'Please enter a valid email address', 'error'); return; } sendBtn.disabled = true; sendBtn.textContent = translations[currentLanguage]?.sending || 'Sending...'; try { const res = await fetch(`${API_URL}/auth/forgot-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) }); const data = await res.json(); if (res.ok) { showMessage(data.message || translations[currentLanguage]?.reset_link_sent || 'Reset link sent! Please check your email.', 'success'); emailInput.value = ''; } else { showMessage(data.error || translations[currentLanguage]?.error || 'Something went wrong. Please try again.', 'error'); } } catch (err) { console.error(err); showMessage(translations[currentLanguage]?.cannot_connect || 'Cannot connect to server. Please try again later.', 'error'); } finally { sendBtn.disabled = false; sendBtn.textContent = translations[currentLanguage]?.send_reset_link || 'Send Reset Link →'; } }
    sendBtn.addEventListener('click', sendResetLink);
    emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendResetLink(); });
  </script>
</body>
</html>
