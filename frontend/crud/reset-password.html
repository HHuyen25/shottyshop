<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="reset_password_title">Reset Password - SHOTTYSHOP</title>
  <link rel="icon" type="image/png" href="/image/logo.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .reset-container { max-width: 450px; margin: 50px auto; padding: 0 20px; }
    .reset-card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .reset-header { text-align: center; margin-bottom: 1.5rem; }
    .reset-header .icon { font-size: 3rem; margin-bottom: 1rem; }
    .reset-header h2 { margin-bottom: 0.5rem; color: #1a1a1a; }
    .reset-header p { color: #666; font-size: 0.85rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
    .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; transition: all 0.2s; }
    .form-input:focus { outline: none; border-color: #1a1a1a; box-shadow: 0 0 0 3px rgba(26,26,26,0.1); }
    .password-strength { margin-top: 0.5rem; font-size: 0.7rem; }
    .strength-weak { color: #dc2626; }
    .strength-fair { color: #f59e0b; }
    .strength-good { color: #10b981; }
    .strength-strong { color: #059669; }
    .btn-primary { width: 100%; background: #1a1a1a; color: white; padding: 12px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: #333; transform: translateY(-2px); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .back-link { text-align: center; margin-top: 1.5rem; }
    .back-link a { color: #666; text-decoration: none; font-size: 0.85rem; }
    .back-link a:hover { color: #1a1a1a; text-decoration: underline; }
    .message { padding: 12px; border-radius: 12px; margin-bottom: 1rem; display: none; text-align: center; }
    .message.success { background: #d1fae5; color: #059669; display: block; }
    .message.error { background: #fee2e2; color: #dc2626; display: block; }
    .requirement { font-size: 0.7rem; color: #999; margin-top: 0.25rem; }
    .requirement.valid { color: #10b981; }
    body.dark-mode .reset-card { background: #1e1e1e; }
    body.dark-mode .reset-header h2 { color: #e0e0e0; }
    body.dark-mode .form-input { background: #2a2a2a; border-color: #444; color: white; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-header">
        <div class="icon"></div>
        <h2 data-key="create_new_password">Create New Password</h2>
        <p data-key="enter_new_password_prompt">Please enter your new password below.</p>
      </div>
      <div id="message" class="message"></div>
      <div class="form-group">
        <label data-key="new_password">New Password</label>
        <input type="password" id="newPassword" class="form-input" data-placeholder-key="new_password">
        <div id="passwordStrength" class="password-strength"></div>
        <div class="requirement" id="lengthReq" data-key="min_6_chars">✓ At least 6 characters</div>
      </div>
      <div class="form-group">
        <label data-key="confirm_password">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-input" data-placeholder-key="confirm_password">
      </div>
      <button id="resetBtn" class="btn-primary" data-key="reset_password_btn">Reset Password →</button>
      <div class="back-link"><a href="login.html" data-key="back_to_login">← Back to Login</a></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const resetBtn = document.getElementById('resetBtn');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const messageDiv = document.getElementById('message');
    const passwordStrength = document.getElementById('passwordStrength');
    const lengthReq = document.getElementById('lengthReq');
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token) { showMessage(translations[currentLanguage]?.invalid_token || 'Invalid or missing reset token. Please request a new password reset link.', 'error'); resetBtn.disabled = true; }
    function checkPasswordStrength(password) { let strength = 0; if (password.length >= 6) strength++; if (password.length >= 10) strength++; if (/[A-Z]/.test(password)) strength++; if (/[0-9]/.test(password)) strength++; if (/[^A-Za-z0-9]/.test(password)) strength++; let strengthText = '', strengthClass = ''; if (password.length === 0) strengthText = ''; else if (strength <= 1) { strengthText = translations[currentLanguage]?.weak_password || 'Weak password'; strengthClass = 'strength-weak'; } else if (strength <= 2) { strengthText = translations[currentLanguage]?.fair_password || 'Fair password'; strengthClass = 'strength-fair'; } else if (strength <= 3) { strengthText = translations[currentLanguage]?.good_password || 'Good password'; strengthClass = 'strength-good'; } else { strengthText = translations[currentLanguage]?.strong_password || 'Strong password!'; strengthClass = 'strength-strong'; } passwordStrength.innerHTML = strengthText ? `<span class="${strengthClass}">${strengthText}</span>` : ''; if (password.length >= 6) lengthReq.classList.add('valid'); else lengthReq.classList.remove('valid'); }
    function validateForm() { const password = newPassword.value, confirm = confirmPassword.value; if (password.length < 6) { showMessage(translations[currentLanguage]?.password_min || 'Password must be at least 6 characters', 'error'); return false; } if (password !== confirm) { showMessage(translations[currentLanguage]?.password_mismatch || 'Passwords do not match', 'error'); return false; } return true; }
    function showMessage(text, type) { messageDiv.textContent = text; messageDiv.className = `message ${type}`; setTimeout(() => messageDiv.style.display = 'none', 5000); }
    async function resetPassword() { if (!validateForm()) return; resetBtn.disabled = true; resetBtn.textContent = translations[currentLanguage]?.resetting || 'Resetting...'; try { const res = await fetch(`${API_URL}/auth/reset-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, newPassword: newPassword.value }) }); const data = await res.json(); if (res.ok) { showMessage(translations[currentLanguage]?.reset_success || 'Password reset successfully! Redirecting to login...', 'success'); setTimeout(() => window.location.href = 'login.html', 2000); } else { showMessage(data.error || translations[currentLanguage]?.reset_failed || 'Failed to reset password. Please try again.', 'error'); resetBtn.disabled = false; resetBtn.textContent = translations[currentLanguage]?.reset_password_btn || 'Reset Password →'; } } catch (err) { console.error(err); showMessage(translations[currentLanguage]?.cannot_connect || 'Cannot connect to server. Please try again later.', 'error'); resetBtn.disabled = false; resetBtn.textContent = translations[currentLanguage]?.reset_password_btn || 'Reset Password →'; } }
    newPassword.addEventListener('input', (e) => checkPasswordStrength(e.target.value));
    resetBtn.addEventListener('click', resetPassword);
    confirmPassword.addEventListener('keypress', (e) => { if (e.key === 'Enter') resetPassword(); });
  </script>
</body>
</html>
