<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="signup_title">Sign Up - SHOTTYSHOP</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .signup-container { max-width: 500px; margin: 50px auto; padding: 0 20px; }
    .signup-card { background: var(--bg-card, white); border-radius: 24px; padding: 2rem; box-shadow: 0 8px 30px var(--shadow, rgba(0,0,0,0.12)); border: 1px solid var(--border-color, #eee); animation: fadeInUp 0.5s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .signup-header { text-align: center; margin-bottom: 2rem; }
    .signup-header .logo { font-size: 3rem; margin-bottom: 0.5rem; }
    .signup-header h2 { font-size: 1.5rem; color: var(--text-primary, #1a1a1a); }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-primary, #1a1a1a); }
    .form-group input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color, #e5e5e5); border-radius: 12px; font-size: 1rem; background: var(--bg-card, white); color: var(--text-primary, #1a1a1a); transition: all 0.2s; }
    .form-group input:focus { outline: none; border-color: #1a1a1a; }
    .form-group input.error { border-color: #ef4444; }
    .form-group input.valid { border-color: #10b981; }
    .error-message { color: #ef4444; font-size: 0.7rem; margin-top: 0.25rem; display: none; }
    .valid-message { color: #10b981; font-size: 0.7rem; margin-top: 0.25rem; display: none; }
    .password-strength { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
    .strength-bar { flex: 1; height: 4px; background: #e5e5e5; border-radius: 2px; transition: all 0.3s; }
    .strength-bar.active { background: #ef4444; }
    .strength-bar.active.weak { background: #ef4444; }
    .strength-bar.active.fair { background: #f59e0b; }
    .strength-bar.active.good { background: #3b82f6; }
    .strength-bar.active.strong { background: #10b981; }
    .strength-text { font-size: 0.7rem; margin-top: 0.25rem; color: var(--text-secondary, #666); }
    .btn-primary { width: 100%; background: #1a1a1a; color: white; padding: 12px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: #333; transform: translateY(-2px); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .divider { text-align: center; margin: 1.5rem 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: calc(50% - 40px); height: 1px; background: var(--border-color, #e5e5e5); }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .divider span { background: var(--bg-card, white); padding: 0 1rem; color: var(--text-secondary, #999); font-size: 0.8rem; }
    .links { text-align: center; margin-top: 1.5rem; }
    .links a { color: var(--text-secondary, #666); text-decoration: none; font-size: 0.85rem; }
    .links a:hover { color: #1a1a1a; text-decoration: underline; }
    .terms { font-size: 0.7rem; text-align: center; margin-top: 1rem; color: var(--text-secondary, #999); }
    .terms a { color: #1a1a1a; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="signup-container">
    <div class="signup-card">
      <div class="signup-header"><div class="logo"></div><h2 data-key="create_account">Create Account</h2><p data-key="join_prompt">Join SHOTTYSHOP today</p></div>
      <div id="globalError" class="error-message" style="text-align:center; margin-bottom:1rem;"></div>
      <div class="form-group"><label data-key="full_name">Full Name</label><input type="text" id="regName" data-placeholder-key="full_name"><div class="error-message" id="nameError" data-key="name_required">Name is required</div></div>
      <div class="form-group"><label data-key="email">Email Address</label><input type="email" id="regEmail" data-placeholder-key="email"><div class="error-message" id="emailError" data-key="valid_email">Please enter a valid email</div></div>
      <div class="form-group"><label data-key="password">Password</label><input type="password" id="regPassword" data-placeholder-key="password"><div class="password-strength" id="passwordStrength"><div class="strength-bar"></div><div class="strength-bar"></div><div class="strength-bar"></div><div class="strength-bar"></div></div><div class="strength-text" id="strengthText"></div><div class="error-message" id="passwordError" data-key="password_min">Password must be at least 6 characters</div><div class="valid-message" id="passwordValid" data-key="password_good">✓ Password looks good!</div></div>
      <div class="form-group"><label data-key="confirm_password">Confirm Password</label><input type="password" id="regConfirmPassword" data-placeholder-key="confirm_password"><div class="error-message" id="confirmError" data-key="password_mismatch">Passwords do not match</div><div class="valid-message" id="confirmValid" data-key="passwords_match">✓ Passwords match</div></div>
      <button id="doRegisterBtn" class="btn-primary" data-key="sign_up">Create Account →</button>
      <div class="divider"><span data-key="or">OR</span></div>
      <div class="links"><a href="login.html" data-key="already_have_account">Already have an account? Sign in</a></div>
      <div class="terms" data-key="terms_agreement">By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api';
    // Trang gốc cần quay về sau khi đăng ký (từ ?redirect=)
    const _rp = new URLSearchParams(location.search).get('redirect') || '';
    const _redirect = (_rp.startsWith('/') && !_rp.startsWith('//')) ? _rp : '/index.html';
    document.addEventListener('DOMContentLoaded', () => {
      const si = document.querySelector('a[data-key="already_have_account"]');
      if (si) si.href = 'login.html?redirect=' + encodeURIComponent(_redirect);
    });
    const registerBtn = document.getElementById('doRegisterBtn');
    const nameInput = document.getElementById('regName');
    const emailInput = document.getElementById('regEmail');
    const passwordInput = document.getElementById('regPassword');
    const confirmInput = document.getElementById('regConfirmPassword');
    function checkPasswordStrength(password) { let strength = 0; if (password.length >= 6) strength++; if (password.length >= 10) strength++; if (/[A-Z]/.test(password)) strength++; if (/[0-9]/.test(password)) strength++; if (/[^A-Za-z0-9]/.test(password)) strength++; const bars = document.querySelectorAll('.strength-bar'); const strengthText = document.getElementById('strengthText'); bars.forEach((bar, i) => { if (i < strength) bar.classList.add('active'); else bar.classList.remove('active', 'weak', 'fair', 'good', 'strong'); if (strength <= 2) bar.classList.add('weak'); else if (strength <= 3) bar.classList.add('fair'); else if (strength <= 4) bar.classList.add('good'); else bar.classList.add('strong'); }); let text = ''; if (strength <= 2) text = translations[currentLanguage]?.weak_password || 'Weak password'; else if (strength <= 3) text = translations[currentLanguage]?.fair_password || 'Fair password'; else if (strength <= 4) text = translations[currentLanguage]?.good_password || 'Good password'; else text = translations[currentLanguage]?.strong_password || 'Strong password!'; strengthText.textContent = password.length ? text : ''; strengthText.style.color = strength <= 2 ? '#ef4444' : strength <= 3 ? '#f59e0b' : strength <= 4 ? '#3b82f6' : '#10b981'; return strength; }
    function validateName() { const name = nameInput.value.trim(); const nameError = document.getElementById('nameError'); if (!name) { nameInput.classList.add('error'); nameInput.classList.remove('valid'); nameError.style.display = 'block'; return false; } nameInput.classList.remove('error'); nameInput.classList.add('valid'); nameError.style.display = 'none'; return true; }
    function validateEmail() { const email = emailInput.value.trim(); const emailError = document.getElementById('emailError'); const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; if (!email || !emailRegex.test(email)) { emailInput.classList.add('error'); emailInput.classList.remove('valid'); emailError.style.display = 'block'; return false; } emailInput.classList.remove('error'); emailInput.classList.add('valid'); emailError.style.display = 'none'; return true; }
    function validatePassword() { const password = passwordInput.value; const passwordError = document.getElementById('passwordError'); const passwordValid = document.getElementById('passwordValid'); if (!password || password.length < 6) { passwordInput.classList.add('error'); passwordInput.classList.remove('valid'); passwordError.style.display = 'block'; passwordValid.style.display = 'none'; return false; } passwordInput.classList.remove('error'); passwordInput.classList.add('valid'); passwordError.style.display = 'none'; passwordValid.style.display = 'block'; checkPasswordStrength(password); return true; }
    function validateConfirm() { const password = passwordInput.value; const confirm = confirmInput.value; const confirmError = document.getElementById('confirmError'); const confirmValid = document.getElementById('confirmValid'); if (!confirm || password !== confirm) { confirmInput.classList.add('error'); confirmInput.classList.remove('valid'); confirmError.style.display = 'block'; confirmValid.style.display = 'none'; return false; } confirmInput.classList.remove('error'); confirmInput.classList.add('valid'); confirmError.style.display = 'none'; confirmValid.style.display = 'block'; return true; }
    function validateAll() { return validateName() && validateEmail() && validatePassword() && validateConfirm(); }
    nameInput.addEventListener('input', () => { validateName(); updateButton(); });
    emailInput.addEventListener('input', () => { validateEmail(); updateButton(); });
    passwordInput.addEventListener('input', () => { validatePassword(); validateConfirm(); updateButton(); });
    confirmInput.addEventListener('input', () => { validateConfirm(); updateButton(); });
    function updateButton() { registerBtn.disabled = !validateAll(); }
    async function register() { if (!validateAll()) return; const name = nameInput.value.trim(); const email = emailInput.value.trim(); const password = passwordInput.value; const globalError = document.getElementById('globalError'); registerBtn.disabled = true; registerBtn.textContent = translations[currentLanguage]?.creating_account || 'Creating account...'; try { const res = await fetch(`${API_URL}/users/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password, role: 'customer' }) }); const data = await res.json(); if (res.ok) { if (data.token) { localStorage.setItem('authToken', data.token); localStorage.setItem('currentUserId', data.user._id); } if (window.toast) toast.success(translations[currentLanguage]?.account_created || 'Đăng ký thành công!'); setTimeout(() => window.location.href = _redirect, 1200); } else { globalError.textContent = data.error || translations[currentLanguage]?.registration_failed || 'Registration failed'; globalError.style.display = 'block'; registerBtn.disabled = false; registerBtn.textContent = translations[currentLanguage]?.sign_up || 'Create Account →'; } } catch (err) { console.error(err); globalError.textContent = translations[currentLanguage]?.cannot_connect || 'Cannot connect to server. Please try again.'; globalError.style.display = 'block'; registerBtn.disabled = false; registerBtn.textContent = translations[currentLanguage]?.sign_up || 'Create Account →'; } }
    registerBtn.addEventListener('click', register);
    confirmInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && validateAll()) register(); });
    updateButton();
  </script>
</body>
</html>
